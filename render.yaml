services:
  - type: web
    name: enterskill-hub-api-v1
    runtime: docker
    rootDir: backend
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: enterskill-hub-db-v1
          property: connectionString
    healthCheckPath: /api/health/
  - type: web
    name: enterskill-hub-web-v1
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://enterskill-hub-api-v1.onrender.com/api
databases:
  - name: enterskill-hub-db-v1
    plan: free
