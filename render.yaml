services:
  - type: web
    name: enterskill-hub-v2
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: enterskill-hub-db-v2
          property: connectionString
databases:
  - name: enterskill-hub-db-v2
    plan: free
    databaseName: enterskill_hub
    user: enterskill_hub
